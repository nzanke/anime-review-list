<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アニメレビュー索引</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"UD英数";src:url(lib/fonts/biz-udgothic-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0020-007E,U+00A0-00FF}
@font-face{font-family:"UD英数";src:url(lib/fonts/biz-udgothic-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0020-007E,U+00A0-00FF}
:root{
  --ui:"UD英数","BIZ UDPGothic","Hiragino Sans",system-ui,sans-serif;
  /* 編集画面と同じ配色：青灰の土台、映画＝藍(230)・テレビ＝青緑(170)を同じトーンで、受賞だけ黄土(42) */
  --ink:hsl(222 24% 18%);--sub:hsl(222 10% 46%);--line:hsl(222 16% 88%);--bg:hsl(222 20% 98%);--card:#fff;
  --movie:hsl(230 45% 38%);--movie-pale:hsl(230 45% 95%);
  --tv:hsl(170 45% 28%);--tv-pale:hsl(170 35% 94%);
  --gold:hsl(42 60% 36%);
  --acc:var(--movie);--acc-pale:var(--movie-pale);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--ui);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
button,input{font-family:inherit;font-size:15px;color:inherit}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
a:hover{text-decoration-color:var(--acc)}
svg.i{width:1em;height:1em;vertical-align:-.13em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
@media (min-width:641px){.wrap{max-width:980px}}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:8px;height:50px}
header h1{font-size:16px;margin:0;flex:1;white-space:nowrap}
header h1 a{text-decoration:none}
.ib{border:0;background:none;cursor:pointer;padding:6px;border-radius:6px;color:var(--sub);line-height:1;display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:13px}
.ib:hover{background:var(--acc-pale);color:var(--acc)}
.ptabs{display:flex;gap:2px;background:hsl(222 16% 94%);border-radius:8px;padding:2px;flex:none}
.ptabs a{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:6px;font-size:13px;color:var(--sub);text-decoration:none;white-space:nowrap}
.ptabs a[aria-current=page]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px hsl(222 20% 40%/.18)}
.ptabs a:hover:not([aria-current]){color:var(--ink)}
/* 検索 */
#search{padding:16px 0 8px}
.box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:46px}
.box:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-pale)}
.box svg{color:var(--sub);width:18px;height:18px}
.box input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:6px 6px;margin:10px 0 0;align-items:center}
.opts .grp{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.opts .gl{font-size:12px;color:var(--sub);margin-right:2px}
.opts .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.ck{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--sub);cursor:pointer;user-select:none}
.ck input{position:absolute;opacity:0;pointer-events:none}
.ck:has(input:checked){border-color:var(--acc);color:var(--acc);background:var(--acc-pale)}
.ck:has(input:focus-visible){outline:2px solid var(--acc)}
#info{font-size:13px;color:var(--sub);margin:12px 2px 4px;min-height:1.6em}
/* 結果 */
#results{list-style:none;margin:0 0 30px;padding:0}
.row{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin:5px 0;padding:8px 10px;text-decoration:none}
.row:hover{border-color:var(--acc)}
.th{flex:none;width:30px;height:45px;border-radius:4px;overflow:hidden;background:var(--acc-pale);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;opacity:.9}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th svg{width:14px;height:14px;opacity:.6}
.row{padding-top:5px!important;padding-bottom:5px!important}
.len{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.55em;height:1.55em;border-radius:4px;font-size:11px;font-weight:700;border:1px solid var(--movie);color:var(--movie);line-height:1}
.len.l長{background:var(--movie);color:#fff}.len.l中{background:var(--movie-pale)}.len.none{border-color:transparent}
.kd{flex:none;color:var(--movie)}.kd.tv{color:var(--tv)}
.dt{flex:none;color:var(--sub);font-size:13px;min-width:5.6em}
.t{flex:1;min-width:0;display:flex;align-items:baseline;gap:14px}
.tt{font-weight:700;flex:0 1 auto;min-width:0}
.sub{flex:0 1000 auto;display:flex;gap:10px;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;min-width:0}
.sub>span{display:inline-flex;align-items:center;gap:3px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sub .ss{padding-left:10px;border-left:1px solid var(--line)}.sub .ss:first-child{padding-left:0;border-left:0}
.meta{flex:none;display:inline-flex;gap:8px;font-size:12px;color:var(--acc);font-weight:700;white-space:nowrap}
.meta .aw{color:var(--gold)}
.tag{font-size:11px;border:1px solid var(--sub);color:var(--sub);border-radius:4px;padding:0 4px;margin-left:6px;font-weight:400;white-space:nowrap}
mark{background:hsl(50 90% 85%);color:inherit;border-radius:2px}
.more{display:block;margin:10px auto 40px;border:1px solid var(--acc);color:var(--acc);background:var(--card);border-radius:8px;padding:7px 20px;cursor:pointer}
@media (min-width:641px){.tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media (max-width:640px){.sub{display:none}.t{display:block}.dt{min-width:4.9em;font-size:12px}}
/* 個別ページ */
#work{padding:14px 0 60px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--sub);text-decoration:none;margin-bottom:10px}
.back:hover{color:var(--acc)}
.wh{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;border-top:4px solid var(--acc)}
.wh.hasp{display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:start}
.wh.hasp>*:not(.poster){grid-column:2}
.wh .poster{grid-row:1/span 3;width:110px;border-radius:6px;box-shadow:0 1px 4px hsl(222 20% 40%/.25)}
@media (max-width:480px){.wh .poster{width:84px}}
.wh .kind{font-size:12px;color:var(--acc);display:inline-flex;align-items:center;gap:4px;font-weight:700}
.wh h2{font-size:21px;margin:4px 0 10px;line-height:1.4}
.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;font-size:14px}
.facts dt{color:var(--sub);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.facts dd{margin:0}
.sec{margin:18px 0 0}
.sec h3{font-size:14px;color:var(--acc);display:flex;align-items:center;gap:6px;margin:0 0 6px;padding-bottom:4px;border-bottom:2px solid var(--acc-pale)}
.sec h3 .n{color:var(--sub);font-weight:400;font-size:12px}
.sec ul{list-style:none;margin:0;padding:0}
.it{padding:7px 2px;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:0}
.it .ico{color:var(--sub);margin-right:2px}
.it .ti{font-weight:700}
.it .src,.it .au,.it .y{white-space:nowrap}
.it .y{color:var(--sub);font-size:13px}
.awi .ico{color:var(--gold)}.awi .prize{color:var(--gold);font-weight:700}
.ndl{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
.none{color:var(--sub);font-size:14px;padding:10px 2px}
footer#credit{font-size:11px;color:var(--sub);padding:18px 14px 30px;line-height:1.5;border-top:1px solid var(--line);margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></symbol>

<symbol id="i-link" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></symbol>
</svg>
<header><div class="wrap">
  <h1><a href="./">アニメレビュー索引</a></h1>
  <nav class="ptabs"><a href="./" aria-current="page"><svg class="i"><use href="#i-search"/></svg>閲覧</a><a href="./edit.html"><svg class="i"><use href="#i-pen"/></svg>編集</a></nav>
</div></header>

<main class="wrap">
  <section id="search">
    <label class="box"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="作品名・監督・スタジオで探す" autocomplete="off" enterkeyhint="search"></label>
    <div class="opts">
      <span class="grp"><span class="gl">対象</span>
        <label class="ck"><input type="checkbox" data-o="fTitle">作品名</label>
        <label class="ck"><input type="checkbox" data-o="fDir"><svg class="i"><use href="#i-mega"/></svg>監督</label>
        <label class="ck"><input type="checkbox" data-o="fStudio"><svg class="i"><use href="#i-studio"/></svg>スタジオ</label>
      </span>
      <span class="sep"></span>
      <span class="grp">
        <label class="ck"><input type="checkbox" data-o="movie"><svg class="i"><use href="#i-film"/></svg>映画</label>
        <label class="ck"><input type="checkbox" data-o="tv"><svg class="i"><use href="#i-tv"/></svg>テレビ</label>
        <label class="ck"><input type="checkbox" data-o="onlyArt"><svg class="i"><use href="#i-doc"/></svg>記事のある作品だけ</label>
        <label class="ck"><input type="checkbox" data-o="soshu"><svg class="i"><use href="#i-layers"/></svg>総集編を含む</label>
      </span>
    </div>
    <div id="info"></div>
    <ul id="results"></ul>
    <button class="more" id="more" hidden>さらに表示</button>
  </section>
  <section id="work" hidden></section>
</main>
<footer class="wrap" id="credit">表紙画像は <a href="https://anilist.co/" target="_blank" rel="noopener">AniList</a> の API を使って表示しています。作品のデータは日本語版ウィキペディアをもとにしています。</footer>

<script>
'use strict';
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const COURS=['冬','春','夏','秋'];
const courOf=md=>{let m=parseInt(md,10),d=parseInt((md||'').split('-')[1],10)||0;if(!m)return '';if(m%3===0&&m<12&&d>=25)m++;return COURS[Math.floor((m-1)/3)]};
const lenCls=m=>m<30?'短編':m<60?'中編':'長編';
const kindOf=id=>id[0]==='f'?'movie':'tv';
const OPT=Object.assign({fTitle:true,fDir:false,fStudio:false,movie:true,tv:true,onlyArt:false,soshu:true},LS.get('arv-opts',{}));
let TITLES=null, STAFF=null, HAS={}, SOSHU={}, THUMBS=null;
// 表紙画像は AniList のもの（大きさ：small／medium／large）
const thumb=(id,size)=>THUMBS&&THUMBS[id]?`https://s4.anilist.co/file/anilistcdn/media/anime/cover/${size}/${THUMBS[id]}`:'';
const cache={};
const getJSON=async(p,fresh)=>{if(cache[p]) return cache[p];const r=await fetch(p,{cache:fresh?'no-cache':'default'});if(r.status===404) return cache[p]=null;if(!r.ok) throw new Error(r.status);return cache[p]=await r.json()};

/* ---------- 文字のゆれをそろえる（全角半角・大文字小文字・カタカナ／ひらがな・空白や記号） ---------- */
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s・･\.,、。!?！？「」『』【】\[\]()（）〈〉〜~\-–—―:：;；'"’”/／]/g,'');

/* ---------- 検索 ---------- */
let shown=0, hits=[];
async function ensureIndex(){
  const ps=[];
  if(!THUMBS) ps.push(getJSON('catalog/thumbs.json').then(d=>{THUMBS=d||{}}).catch(()=>{THUMBS={}}));
  if(!TITLES) ps.push(getJSON('catalog/search-titles.json').then(d=>{TITLES=d.map(r=>({id:r[0],title:r[1],date:r[2],min:r[3],n:norm(r[1])}))}));
  if((OPT.fDir||OPT.fStudio||matchMedia('(min-width:641px)').matches)&&!STAFF) ps.push(getJSON('catalog/search-staff.json').then(d=>{STAFF={};for(const r of d) STAFF[r[0]]={dir:r[1],studio:r[2],nd:norm(r[1]),ns:norm(r[2])}}));
  if(ps.length){$('#info').textContent='索引を読み込み中…';await Promise.all(ps)}
}
function allWorks(){
  // 台帳の作品に、編集画面で追加した作品（has.json の6番目に題名）を足す
  const extra=Object.entries(HAS).filter(([id,v])=>v[5]).map(([id,v])=>({id,title:v[5],date:v[1],min:0,n:norm(v[5]),k:v[0]}));
  return TITLES.concat(extra);
}
async function search(){
  const q=$('#q').value.trim();
  LS.set('arv-q',q);
  if(!q&&!OPT.onlyArt){$('#info').textContent='作品名・監督・スタジオを入れて探せます。「記事のある作品だけ」を選ぶと、記事の登録された作品が並びます。';$('#results').innerHTML='';$('#more').hidden=true;return}
  await ensureIndex();
  const toks=q.split(/[\s　]+/).map(norm).filter(Boolean);
  hits=[];
  for(const w of allWorks()){
    const k=w.k||kindOf(w.id);
    if(!OPT[k]) continue;
    if(!OPT.soshu&&SOSHU[w.id]) continue;
    if(OPT.onlyArt&&!(HAS[w.id]&&HAS[w.id][2]+HAS[w.id][3]+HAS[w.id][4])) continue;
    if(toks.length){
      const st=STAFF&&STAFF[w.id];
      const ok=toks.every(t=>(OPT.fTitle&&w.n.includes(t))||(OPT.fDir&&st&&st.nd.includes(t))||(OPT.fStudio&&st&&st.ns.includes(t)));
      if(!ok) continue;
    }
    hits.push(w);
  }
  const t0=toks[0]||'';
  hits.sort((a,b)=>((t0&&b.n.startsWith(t0))-(t0&&a.n.startsWith(t0)))||(b.date<a.date?-1:b.date>a.date?1:0));
  shown=0; $('#results').innerHTML=''; more();
  $('#info').textContent=hits.length?`${hits.length.toLocaleString()}件`:'見つかりませんでした';
}
function fmtD(d){const m=String(d).match(/^(\d{4})(?:-(\d\d)(?:-(\d\d))?)?/);if(!m)return '';return m[1]+(m[2]?'/'+(+m[2])+(m[3]?'/'+(+m[3]):''):'')}
function rowHtml(w){
  const k=w.k||kindOf(w.id), y=String(w.date).slice(0,4), st=STAFF&&STAFF[w.id], h=HAS[w.id];
  const dirs=st?(st.dir||'').split('、').filter(Boolean):[], sts=st?(st.studio||'').split('、').filter(x=>x&&x!=='-'):[];
  const sub=(dirs.length||sts.length)?`<span class="sub">${dirs.length?`<span>${ic('mega')}${esc(dirs.length>2?dirs.slice(0,2).join('・')+' ほか':dirs.join('・'))}</span>`:''}${sts.length?`<span class="ss">${ic('studio')}${esc(sts[0])}${sts.length>1?' ほか':''}</span>`:''}</span>`:'';
  const len=k==='movie'?(w.min?`<span class="len l${lenCls(w.min)[0]}" title="${lenCls(w.min)}（${w.min}分）">${lenCls(w.min)[0]}</span>`:'<span class="len none"></span>'):'<span class="len none"></span>';
  const meta=h?`<span class="meta">${h[2]?`<span title="レビュー">${ic('doc')}${h[2]}</span>`:''}${h[3]?`<span title="資料">${ic('lib')}${h[3]}</span>`:''}${h[4]?`<span class="aw" title="受賞歴">${ic('trophy')}${h[4]}</span>`:''}</span>`:'';
  const th=thumb(w.id,'small');
  return `<li><a class="row" href="#/${k}/${y}/${w.id}"><span class="th">${th?`<img src="${th}" alt="" loading="lazy" decoding="async">`:ic(k==='tv'?'tv':'film')}</span>${len}<span class="dt">${fmtD(w.date)}</span><span class="t"><span class="tt" title="${esc(w.title)}">${esc(w.title)}${SOSHU[w.id]?'<span class="tag">総集編</span>':''}</span>${sub}</span>${meta}</a></li>`;
}
function more(){
  const n=Math.min(hits.length,shown+100);
  $('#results').insertAdjacentHTML('beforeend',hits.slice(shown,n).map(rowHtml).join(''));
  shown=n; $('#more').hidden=shown>=hits.length;
  $('#more').textContent=`さらに表示（残り${(hits.length-shown).toLocaleString()}件）`;
}

/* ---------- 個別ページ ---------- */
const fmtDate=r=>r.date?r.date.replace(/^(\d+)-0?(\d+)-0?(\d+)$/,'$1/$2/$3'):(r.year||'');
const artKey=r=>r.date||(r.year?r.year+'-99':'9999');
function rvLine(r){
  const ti=`「${esc(r.title)}」`, d=fmtDate(r);
  const src=r.type==='web'?`<span class="src"><span class="ico">${ic('globe')}</span>${esc(r.media)}</span>`:`<span class="src"><span class="ico">${ic('book')}</span>『${esc(r.media)}』${r.publisher?esc(r.publisher):''}</span>`;
  return `<li class="it">${r.author?`<span class="au"><span class="ico">${ic('person')}</span>${esc(r.author)}</span>`:''}<span class="ti">${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${ti}</a>`:ti}</span> ${src}${d?` <span class="y">${ic('cal')}${esc(d)}</span>`:''}</li>`;
}
function srLine(r){
  const t=r.type||'ndl', link=x=>r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${x}</a>`:x;
  let b='';
  if(t==='ndl') b=`<span class="ti">${link((r.title?`「${esc(r.title)}」`:'')+`『${esc(r.book)}』`)}</span>${r.publisher?` <span class="src">${esc(r.publisher)}</span>`:''}${r.year?` <span class="y">${ic('cal')}${esc(r.year)}</span>`:''}${r.pages?` <span class="y">p.${esc(r.pages)}</span>`:''} <span class="ndl" title="国立国会図書館デジタルコレクション">${ic('lib')}NDL</span>`;
  else if(t==='web') b=`<span class="ti">${link(`「${esc(r.title)}」`)}</span> <span class="src"><span class="ico">${ic('globe')}</span>${esc(r.media)}</span>${r.date||r.year?` <span class="y">${ic('cal')}${esc(fmtDate(r))}</span>`:''}`;
  else b=`<span class="ti">${link(`「${esc(r.title)}」`)}</span> <span class="src"><span class="ico">${ic('book')}</span>『${esc(r.media)}』${r.publisher?esc(r.publisher):''}</span>${r.year?` <span class="y">${ic('cal')}${esc(r.year)}</span>`:''}`;
  return `<li class="it">${r.author?`<span class="au"><span class="ico">${ic('person')}</span>${esc(r.author)}</span>`:''}${b}</li>`;
}
async function showWork(k,y,id){
  $('#search').hidden=true; const el=$('#work'); el.hidden=false;
  el.innerHTML='<div class="none">読み込み中…</div>';
  document.body.style.setProperty('--acc',`var(--${k})`); document.body.style.setProperty('--acc-pale',`var(--${k}-pale)`);
  let cat, ud;
  try{[cat,ud]=await Promise.all([getJSON(`catalog/${k}/${y}.json`),getJSON(`data/${k}/${y}.json`,true)])}catch(e){el.innerHTML='<div class="none">読み込めませんでした</div>';return}
  ud=ud||{w:{},add:[],fix:{}};
  let w=null;
  const c=(cat||[]).find(x=>x[0]===id);
  if(c) w={id,title:c[1],md:c[2],studio:c[3],dir:c[4],min:c[5]||0};
  else{const a=(ud.add||[]).find(x=>x.id===id); if(a) w={id,title:a.title,md:a.md||'',studio:'',dir:'',min:0,cour:a.cour}}
  if(!w){el.innerHTML=`<a class="back" href="#">${ic('undo')}検索に戻る</a><div class="none">作品が見つかりませんでした</div>`;return}
  const fx=(ud.fix||{})[id]||{}; if(fx.title) w.title=fx.title;
  const cour=k==='tv'?(fx.cour||w.cour||courOf(w.md)):'';
  const s=(ud.w||{})[id]||{}, rv=(s.rv||[]).slice().sort((a,b)=>artKey(a)<artKey(b)?-1:1), sr=(s.sr||[]).slice().sort((a,b)=>artKey(a)<artKey(b)?-1:1), aw=(s.aw||[]).slice().sort((a,b)=>(a.year||9999)-(b.year||9999));
  const m=w.md.match(/^(\d+)(?:-(\d+))?/);
  const date=y+'年'+(m?(+m[1])+'月'+(m[2]?(+m[2])+'日':''):'');
  const facts=[[ic('cal')+(k==='tv'?'放送開始':'公開'),date+(cour?`（${cour}クール）`:'')]];
  if(w.min) facts.push([ic('clock')+'上映時間',`${w.min}分（${lenCls(w.min)}）`]);
  if(w.dir) facts.push([ic('mega')+'監督',esc(w.dir)]);
  if(w.studio&&w.studio!=='-') facts.push([ic('studio')+'制作',esc(w.studio)]);
  if(!THUMBS){try{THUMBS=await getJSON('catalog/thumbs.json')||{}}catch(e){THUMBS={}}}
  const pt=thumb(id,'medium');
  let h=`<a class="back" href="#">${ic('undo')}検索に戻る</a>
  <div class="wh${pt?' hasp':''}">${pt?`<img class="poster" src="${pt}" alt="">`:''}<span class="kind">${ic(k==='tv'?'tv':'film')}${k==='tv'?'テレビアニメ':'アニメ映画'}${SOSHU[id]?'<span class="tag">総集編</span>':''}</span><h2>${esc(w.title)}</h2>
  <dl class="facts">${facts.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl></div>`;
  const sec=(icon,name,list,fn)=>list.length?`<div class="sec"><h3>${ic(icon)}${name}<span class="n">${list.length}件</span></h3><ul>${list.map(fn).join('')}</ul></div>`:'';
  h+=sec('doc','レビュー',rv,rvLine)+sec('lib','資料',sr,srLine)+sec('trophy','受賞歴',aw,a=>`<li class="it awi"><span class="ico">${ic('trophy')}</span>${esc(a.name)}${a.prize?` <span class="prize">${esc(a.prize)}</span>`:''}${a.year?` <span class="y">${ic('cal')}${esc(a.year)}</span>`:''}</li>`);
  if(!rv.length&&!sr.length&&!aw.length) h+='<div class="none">まだ記事は登録されていません。</div>';
  el.innerHTML=h;
  document.title=w.title+'｜アニメレビュー索引';
  window.scrollTo(0,0);
}

/* ---------- 画面の切り替え ---------- */
let searchY=0;
function route(){
  const m=location.hash.match(/^#\/(movie|tv)\/(\d{4})\/([\w-]+)$/);
  if(m){searchY=$('#work').hidden?window.scrollY:searchY;showWork(m[1],m[2],m[3]);return}
  $('#work').hidden=true; $('#search').hidden=false;
  document.body.style.removeProperty('--acc'); document.body.style.removeProperty('--acc-pale');
  document.title='アニメレビュー索引';
  window.scrollTo(0,searchY);
}
window.addEventListener('hashchange',route);
let timer=null;
$('#q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,200)});
$('#q').addEventListener('focus',()=>{ensureIndex().then(()=>{if(!$('#q').value.trim()&&!OPT.onlyArt)$('#info').textContent='作品名・監督・スタジオを入れて探せます。'})},{once:true});
$('#more').addEventListener('click',more);
document.querySelectorAll('[data-o]').forEach(cb=>{
  cb.checked=!!OPT[cb.dataset.o];
  cb.addEventListener('change',()=>{OPT[cb.dataset.o]=cb.checked;LS.set('arv-opts',OPT);search()});
});

(async()=>{
  try{[HAS,SOSHU]=await Promise.all([getJSON('data/has.json',true),getJSON('data/soshu.json',true)])}catch(e){}
  HAS=HAS||{}; SOSHU=SOSHU||{};
  $('#q').value=LS.get('arv-q','');
  if(location.hash.startsWith('#/')) route();
  search();
})();
</script>
</body>
