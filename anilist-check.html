<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>表紙画像の確認｜アニメレビュー索引</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"UD英数";src:url(lib/fonts/biz-udgothic-latin-400-normal.woff2) format("woff2");font-weight:400;unicode-range:U+0020-007E,U+00A0-00FF}
@font-face{font-family:"UD英数";src:url(lib/fonts/biz-udgothic-latin-700-normal.woff2) format("woff2");font-weight:700;unicode-range:U+0020-007E,U+00A0-00FF}
:root{--ink:hsl(222 24% 18%);--sub:hsl(222 10% 46%);--line:hsl(222 16% 88%);--bg:hsl(222 20% 98%);--acc:hsl(230 45% 38%);--pale:hsl(230 45% 95%);--warn:hsl(4 55% 44%)}
*{box-sizing:border-box}body{margin:0;font-family:"UD英数","BIZ UDPGothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:12px 14px 100px}
h1{font-size:17px;margin:4px 0}p{color:var(--sub);font-size:13px;margin:4px 0 10px}
.it{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:8px 0}
.it.diff{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.t{font-weight:700}.m{color:var(--sub);font-size:12px;margin-left:6px;font-weight:400}
.cs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.c{display:flex;gap:6px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:5px;background:#fff;cursor:pointer;width:calc(50% - 3px);text-align:left;font:inherit;font-size:13px}
.c img,.c .noimg{width:38px;height:54px;object-fit:cover;border-radius:3px;flex:none;background:var(--pale)}
.c[aria-pressed=true]{border-color:var(--acc);background:var(--pale);box-shadow:0 0 0 1px var(--acc) inset}
.c .ct{font-weight:700}.c .cm{color:var(--sub);font-size:11px;display:block}
.c.none{align-items:center;justify-content:center;color:var(--sub)}
@media (max-width:520px){.c{width:100%}}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:9px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.bar button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 20px;font:inherit;cursor:pointer}
.bar .pg{background:#fff;color:var(--acc);border:1px solid var(--acc);padding:6px 12px}
#st{font-size:13px;color:var(--sub)}#st.ng{color:var(--warn)}
</style></head><body><div class="wrap">
<h1>表紙画像の確認</h1>
<p>台帳の作品と AniList の作品を自動で結び付けたとき、迷ったものです。正しい作品を選んでください（どれも違えば「どれも違う」）。最初に選ばれているのが案なので、案と違うものだけ押し直せば足ります（押し直した作品は枠が濃くなります）。「決定を保存」を押すと、表紙が閲覧ページに反映されます（数分かかります）。</p>
<div id="list">読み込み中…</div></div>
<div class="bar"><button class="pg" id="prev">前の50件</button><span id="st"></span><button class="pg" id="next">次の50件</button><button id="save">決定を保存</button></div>
<script>
const API='https://api.github.com/repos/nzanke/anime-review-list';
const IMG=n=>`https://s4.anilist.co/file/anilistcdn/media/anime/cover/small/${n}`;
const FMT={TV:'テレビ',TV_SHORT:'テレビ（短編）',MOVIE:'映画',SPECIAL:'特番',OVA:'OVA',ONA:'配信',MUSIC:'MV'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cfg={};try{cfg=JSON.parse(localStorage.getItem('arl-cfg'))||{}}catch(e){}
let ITEMS=[], DEC={}, pick={}, page=0;
const st=(m,ng)=>{const s=document.getElementById('st');s.textContent=m;s.className=ng?'ng':''};
function draw(){
  const L=ITEMS.slice(page*50,page*50+50);
  document.getElementById('list').innerHTML=L.length?L.map(i=>{
    const prop=String(i.cands[0].aid);
    return `<div class="it${pick[i.id]!==prop?' diff':''}"><div class="t">${esc(i.title)}<span class="m">${esc(i.date)}・${i.id[0]==='f'?'映画':'テレビ'}</span></div><div class="cs">${i.cands.map(c=>`<button class="c" data-id="${i.id}" data-v="${c.aid}" aria-pressed="${pick[i.id]===String(c.aid)}">${c.cover?`<img src="${IMG(c.cover)}" alt="" loading="lazy">`:'<span class="noimg"></span>'}<span><span class="ct">${esc(c.title)}</span><span class="cm">${c.year||'年不明'}・${FMT[c.format]||c.format||''}</span></span></button>`).join('')}<button class="c none" data-id="${i.id}" data-v="none" aria-pressed="${pick[i.id]==='none'}">どれも違う</button></div></div>`}).join(''):'<p>確認する作品はありません。</p>';
  const pages=Math.max(1,Math.ceil(ITEMS.length/50));
  st(`${page+1}／${pages}ページ（全${ITEMS.length}件）`);
  document.getElementById('prev').disabled=page===0; document.getElementById('next').disabled=page>=pages-1;
}
document.addEventListener('click',e=>{const b=e.target.closest('button.c');if(!b)return;pick[b.dataset.id]=b.dataset.v;draw()});
document.getElementById('prev').onclick=()=>{page--;draw();scrollTo(0,0)};
document.getElementById('next').onclick=()=>{page++;draw();scrollTo(0,0)};
async function gh(method,path,body){const r=await fetch(API+path,{method,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!r.ok&&!(method==='GET'&&r.status===404))throw new Error(r.status);return r.status===404?null:r.json()}
document.getElementById('save').onclick=async()=>{
  if(!cfg.token){st('編集画面で「保存の設定」をしてから押してください',1);return}
  st('保存中…');
  try{
    const f=await gh('GET','/contents/data/anilist-decisions.json?ref=main&t='+Date.now());
    const cur=f?JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\n/g,''))))):{};
    // 確認した作品（いま表示しているページまで）の判断を書く
    ITEMS.slice(0,(page+1)*50).forEach(i=>cur[i.id]=pick[i.id]);
    const sorted={};Object.keys(cur).sort().forEach(k=>sorted[k]=cur[k]);
    const txt=JSON.stringify(sorted,null,1)+'\n';
    await gh('PUT','/contents/data/anilist-decisions.json',Object.assign({message:'表紙画像の確認結果を保存',content:btoa(unescape(encodeURIComponent(txt)))},f?{sha:f.sha}:{}));
    st(`保存しました（${Math.min(ITEMS.length,(page+1)*50)}件分）。数分で閲覧ページに反映されます`);
  }catch(e){st('保存できませんでした（'+e.message+'）',1)}
};
(async()=>{
  try{
    const [u,d]=await Promise.all([fetch('data/anilist-unsure.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]),fetch('data/anilist-decisions.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{})]);
    DEC=d||{}; ITEMS=(u||[]).filter(i=>!(i.id in DEC)&&i.cands.length);
    ITEMS.forEach(i=>pick[i.id]=String(i.cands[0].aid));
  }catch(e){}
  draw();
})();
</script></body></html>
