name: AniListの表紙画像を照合
on:
  push:
    branches: [main]
    paths: ['data/anilist-decisions.json']
  workflow_dispatch:
    inputs:
      args:
        description: 'anilist_match.py に渡す引数（--only-new で未照合の作品だけ）'
        required: false
        default: ''
concurrency:
  group: anilist
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: 照合する
        run: python3 tools/anilist_match.py ${{ github.event_name == 'push' && '--apply' || github.event.inputs.args }}
      - name: 結果を保存する
        if: always()
        run: |
          git config user.name nzanke
          git config user.email nzanke@users.noreply.github.com
          git add catalog/thumbs.json data/anilist-*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "AniListの表紙画像の照合結果を保存"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
