<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>総集編の確認｜アニメレビュー索引</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"UD英数";src:url(lib/fonts/biz-udgothic-latin-400-normal.woff2) format("woff2");font-weight:400;unicode-range:U+0020-007E,U+00A0-00FF}
@font-face{font-family:"UD英数";src:url(lib/fonts/biz-udgothic-latin-700-normal.woff2) format("woff2");font-weight:700;unicode-range:U+0020-007E,U+00A0-00FF}
:root{--ink:hsl(222 24% 18%);--sub:hsl(222 10% 46%);--line:hsl(222 16% 88%);--bg:hsl(222 20% 98%);--acc:hsl(230 45% 38%);--pale:hsl(230 45% 95%);--warn:hsl(4 55% 44%)}
*{box-sizing:border-box}body{margin:0;font-family:"UD英数","BIZ UDPGothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 90px}
h1{font-size:17px;margin:4px 0}p{color:var(--sub);font-size:13px;margin:4px 0 12px}
.it{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:7px 0}
.it.diff{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.t{font-weight:700}.m{color:var(--sub);font-size:13px}.why{font-size:13px;margin:3px 0 6px}
.bs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bs button{border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:6px;padding:4px 14px;cursor:pointer;font:inherit;font-size:14px}
.bs button[aria-pressed=true]{background:var(--acc);color:#fff}
.prop{font-size:12px;color:var(--sub)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:center}
.bar button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 22px;font:inherit;cursor:pointer}
#st{font-size:13px;color:var(--sub)}#st.ng{color:var(--warn)}
</style></head><body><div class="wrap">
<h1>総集編の確認（迷う25本）</h1>
<p>それぞれ「総集編」か「違う」を選んでください。最初に選ばれているのが案です。案と違うものだけ押し直せば足ります（押し直した作品は枠が濃くなります）。最後に「決定を保存」を押すと、索引のページに反映されます。</p>
<div id="list"></div></div>
<div class="bar"><span id="st"></span><button id="save">決定を保存</button></div>
<script>
const ITEMS=[{"id": "f0249", "t": "キャンディ♥キャンディ 春の呼び声", "y": "1978", "m": 25, "why": "1978年・25分。テレビ話のブローアップの可能性", "p": 1}, {"id": "f0257", "t": "キャンディ♥キャンディ キャンディキャンディの夏休み", "y": "1978", "m": 15, "why": "1978年・15分。テレビ話のブローアップの可能性", "p": 1}, {"id": "f0280", "t": "家なき子", "y": "1980", "m": 96, "why": "1980年の劇場版。テレビ版の再編集かどうか記事から読み切れない", "p": 1}, {"id": "f0310", "t": "キャプテン", "y": "1981", "m": 95, "why": "1981年の劇場版。テレビ版の再編集か新作か記事から読み切れない", "p": 1}, {"id": "f0325", "t": "まんが日本昔ばなし ほらふき天狗/おけさねこ", "y": "1982", "m": 24, "why": "テレビの数話を劇場にかけたものの可能性", "p": 1}, {"id": "f0415", "t": "ゲゲゲの鬼太郎", "y": "1985", "m": 24, "why": "1985年・24分。テレビ話のブローアップの可能性", "p": 1}, {"id": "f0464", "t": "グリム童話 金の鳥", "y": "1987", "m": 52, "why": "52分。テレビ版のブローアップの可能性", "p": 0}, {"id": "f0473", "t": "ほえろブンブン", "y": "1987", "m": 65, "why": "1987年・65分。テレビ版の再編集の可能性", "p": 0}, {"id": "f0497", "t": "レディレディ!!", "y": "1988", "m": 27, "why": "1988年・27分。テレビ話のブローアップの可能性", "p": 1}, {"id": "f0537", "t": "トップをねらえ!", "y": "1989", "m": 60, "why": "1989年・60分の上映版。OVAの再編集の可能性", "p": 1}, {"id": "f0602", "t": "それいけ!アンパンマン とべ! とべ! ちびごん", "y": "1991", "m": 40, "why": "アンパンマン映画の併映作。名場面集的な内容との記述が近くにある", "p": 0}, {"id": "f0606", "t": "ドキンちゃんのドキドキカレンダー", "y": "1991", "m": 50, "why": "アンパンマン映画の併映作。名場面集的な内容との記述が近くにある", "p": 0}, {"id": "f0627", "t": "キャンディ♥キャンディ", "y": "1992", "m": 26, "why": "1992年・26分。テレビ話のブローアップの可能性", "p": 1}, {"id": "f0778", "t": "ジャングル大帝", "y": "1997", "m": 99, "why": "1997年版。新作だが、記事に再編集の記述が混じる", "p": 0}, {"id": "f1150", "t": "劇場版 マクロスF 虚空歌姫 〜イツワリノウタヒメ〜", "y": "2009", "m": 120, "why": "「7割旧作、3割新作」の総集編的な前編", "p": 1}, {"id": "f1176", "t": "劇場版 銀魂 新訳紅桜篇", "y": "2010", "m": 96, "why": "テレビ版の紅桜篇を作り直したもの（多くは描き直し）", "p": 0}, {"id": "f1334", "t": "劇場版 TIGER & BUNNY -The Beginning-", "y": "2012", "m": 93, "why": "テレビ第1・2話の再構成に新作を加えたもの", "p": 0}, {"id": "f1403", "t": "劇場版 あの日見た花の名前を僕達はまだ知らない。", "y": "2013", "m": 99, "why": "当初は総集編として企画。実際は新作部分が多い", "p": 0}, {"id": "f1564", "t": "KING OF PRISM by PrettyRhythm", "y": "2016", "m": 58, "why": "劇場作品だが、テレビ版の再構成との記述が近くにある", "p": 0}, {"id": "f1578", "t": "甲鉄城のカバネリ 序章", "y": "2016", "m": 68, "why": "序章。テレビ版の再編集かどうか読み切れない", "p": 0}, {"id": "f1735", "t": "劇場版 マクロスΔ 激情のワルキューレ", "y": "2018", "m": 120, "why": "テレビ版を再構成し新作を加えたもの", "p": 1}, {"id": "f2024", "t": "フルーツバスケット prelude", "y": "2022", "m": 88, "why": "テレビシリーズの総集編に新作を加えたもの", "p": 1}, {"id": "f2278", "t": "KING OF PRISM Your Endless Call み～んなきらめけ！プリズム☆ツアーズ", "y": "2025", "m": 61, "why": "「Shiny Seven Stars」の再構成とある", "p": 1}, {"id": "f2321", "t": "魔法の天使クリィミーマミ 永遠のワンスモア(1984)", "y": "2026", "m": 91, "why": "前半45分がテレビシリーズの総集編、後半が新作", "p": 1}, {"id": "f2328", "t": "新劇場版 銀魂 吉原大炎上", "y": "2026", "m": 124, "why": "吉原炎上篇の再編集に新作を加えたものの可能性", "p": 1}];
const API='https://api.github.com/repos/nzanke/anime-review-list';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cfg={};try{cfg=JSON.parse(localStorage.getItem('arl-cfg'))||{}}catch(e){}
const pick={};ITEMS.forEach(i=>pick[i.id]=i.p);
function draw(){document.getElementById('list').innerHTML=ITEMS.map(i=>`<div class="it${pick[i.id]!==i.p?' diff':''}"><div class="t">${esc(i.t)}</div><div class="m">${i.y}年${i.m?'・'+i.m+'分':''}</div><div class="why">${esc(i.why)}</div><div class="bs"><button data-id="${i.id}" data-v="1" aria-pressed="${pick[i.id]===1}">総集編</button><button data-id="${i.id}" data-v="0" aria-pressed="${pick[i.id]===0}">違う</button><span class="prop">案：${i.p?'総集編':'違う'}</span></div></div>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;pick[b.dataset.id]=+b.dataset.v;draw()});
const st=(m,ng)=>{const s=document.getElementById('st');s.textContent=m;s.className=ng?'ng':''};
async function gh(method,path,body){const r=await fetch(API+path,{method,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
document.getElementById('save').onclick=async()=>{
  if(!cfg.token){st('索引のページで「保存の設定」をしてから押してください',1);return}
  st('保存中…');
  try{
    const f=await gh('GET','/contents/data/soshu.json?ref=main&t='+Date.now());
    const cur=JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\n/g,'')))));
    ITEMS.forEach(i=>{if(pick[i.id]) cur[i.id]=[i.t,i.y]; else delete cur[i.id]});
    const sorted={};Object.keys(cur).sort().forEach(k=>sorted[k]=cur[k]);
    const txt=JSON.stringify(sorted,null,1)+'\n';
    await gh('PUT','/contents/data/soshu.json',{message:'総集編の確認結果を保存',content:btoa(unescape(encodeURIComponent(txt))),sha:f.sha});
    const n=ITEMS.filter(i=>pick[i.id]).length;
    st(`保存しました（25本のうち総集編${n}本）。索引のページを開き直すと反映されます`);
  }catch(e){st('保存できませんでした（'+e.message+'）',1)}
};
draw();
</script></body></html>
